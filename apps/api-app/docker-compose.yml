services:
  api:
    image: hirekal/api:prod
    build:
      context: ../..
      dockerfile: apps/api-app/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
